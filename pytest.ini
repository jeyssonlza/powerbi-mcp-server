[pytest]
# ===========================================================================
# Pytest Configuration
# ===========================================================================

# Rutas y archivos de test
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Modo asincrónico automático
asyncio_mode = auto

# Opciones de ejecución
addopts =
    -ra
    --strict-markers
    --cov=powerbi_mcp
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-branch
    --cov-fail-under=75
    -v
    --tb=short

# Minversion
minversion = 8.0

# Marcadores personalizados para categorizar tests
markers =
    unit: Unit tests (no dependencies)
    integration: Integration tests (with mocks)
    slow: Tests that take > 1 second
    benchmark: Performance benchmarks (pytest-benchmark)
    performance: Performance and scalability tests
    asyncio: Async tests
    auth: OAuth2/Authentication tests
    security: Security-related tests
    memory: Memory usage tests
    concurrent: Concurrent operation tests
    scalability: Scalability tests with large datasets

# Configuración de cobertura
[coverage:run]
branch = True
source = powerbi_mcp
omit =
    */tests/*
    */site-packages/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    class .*\(ABC\):
    logger.
    if logger.
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
