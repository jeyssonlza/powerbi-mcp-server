name: Bug report
description: Report a defect or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please avoid including real credentials,
        customer data or private PBIX/PBIP files.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue.
      placeholder: |
        1. Open project X
        2. Call tool Y
        3. See error Z
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Project version or commit hash.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: python
    attributes:
      label: Python version
      options:
        - "3.10"
        - "3.11"
        - "3.12"
        - "3.13"
        - "3.14"
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Paste error messages or MCP tool responses (redact secrets).

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I did not include secrets, tokens or private Power BI files
          required: true
