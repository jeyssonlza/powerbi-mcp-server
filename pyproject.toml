# ===========================================================================
# Power BI MCP Server - Configuracion del proyecto (PEP 621)
# ===========================================================================
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "powerbi-mcp-server"
version = "0.1.0"
description = "Servidor MCP profesional para gestion, modelado, IA, visuales y documentacion de proyectos Power BI (PBIP/PBIX)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Jeysson Zerpa", email = "jeyssonzerpa@gmail.com" },
]
keywords = [
    "power-bi", "pbip", "pbix", "mcp", "model-context-protocol",
    "dax", "data-modeling", "business-intelligence", "ai", "machine-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business",
]

dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "openpyxl>=3.1.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "statsmodels>=0.14.0",
    "plotly>=5.20.0",
    "jinja2>=3.1.0",
    "cryptography>=42.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "msal>=1.28.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-benchmark>=4.0.0",
    "responses>=0.24.0",
    "psutil>=5.9.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.urls]
Homepage = "https://github.com/jeyssonzerpa/powerbi-mcp-server"
Repository = "https://github.com/jeyssonzerpa/powerbi-mcp-server"
Issues = "https://github.com/jeyssonzerpa/powerbi-mcp-server/issues"

# Punto de entrada ejecutable del servidor MCP
[project.scripts]
powerbi-mcp = "powerbi_mcp.__main__:main"

# ---------------------------------------------------------------------------
# Empaquetado (src layout)
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
powerbi_mcp = ["py.typed", "templates/**/*", "assets/**/*"]

# ---------------------------------------------------------------------------
# Ruff (lint + format)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["powerbi_mcp"]

[tool.ruff.lint.per-file-ignores]
# Convención estándar en ML: X/y como matriz y vector objetivo.
"src/powerbi_mcp/ai/**/*.py" = ["N806", "N803"]

# ---------------------------------------------------------------------------
# Mypy (tipado estatico)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --cov=powerbi_mcp --cov-report=term-missing"
