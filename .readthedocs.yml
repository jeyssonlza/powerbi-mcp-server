# ===========================================================================
# ReadTheDocs configuration
# https://docs.readthedocs.io/en/stable/config-file/v2.html
# ===========================================================================
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      - echo "Building Power BI MCP Server docs..."

# Build with MkDocs
mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: false

# Python environment
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - dev
    - requirements: docs/requirements-docs.txt
